topics:
    td1: '**Day 1 Self-Care and Observation** \n Take a moment to notice you surroundings the next time you are outdoors today and take a few minutes to reflect on the guiding thoughts of the day, before answering todays question. \n **Todays guiding thoughts** \n Take a moment to think about where you are right now. It could be your home, a park, near a water drain, or any place you often visit. Look around and notice the details - what do you see? Is there anything different about the space today? Pay attention to what you can hear, smell or feel. Are there sounds, like birds or people? Can you feel the weather or notice anything about the place that stands out? Now, think about how being in this space makes you feel. Are you calm, happy or perhaps a bit distracted? Do you feel connected to this place or more distant from it today? \n **Question for the Day** \n Where are you today, and what do you notice about this place? \n Take a moment to describe where you are and what stands out to you. How do you feel in this space right now? \n Feel free to share photos, voice notes, emojis or written text.'
    td2: '**Day 2 Emotional Check-In** \n Take a moment to notice you surroundings the next time you are outdoors today and take a few minutes to reflect on the guiding thoughts of the day, before answering todays question. \n **Todays guiding thoughts** \n Pay attention to what is happening around you. Is there sunlight shining on you? Do you hear birdfs, cars or people? Maybe there is a certain smell in the air or a breeze that feels nice. Think about how these things make you feel. \n **Question for the Day** \n Do you feel connected or disconnected to this space today? \n Think about your mood or emotions as you spend time here. Is there something about this space that makes you feel at home, calm, or in tune with it? Or do you feel distant, unsettled or out of place?'
    td3: '**Day 3 Noticing Small Actions** \n Take a moment to notice you surroundings the next time you are outdoors today and take a few minutes to reflect on the guiding thoughts of the day, before answering todays question. \n **Todays guiding thoughts** \n Look for small acts of care in the space around you. THese might be things that often go unnoticed, like someone sweeping a path, picking up litter, or even checking a water drain. These small actions can tell us a lot about how people take care of their environment. \n **Question for the Day** \n What is something small you noticed today that someone did to care for this outdoor space? \n It might be as simple as picking up litter, watering a plant, or ficing something that was broken. If you did something like this yourself, feel free to share that too. '
    td4: '**Day 4: Environmental Reflection** \n Take a moment to notice you surroundings the next time you are outdoors today and take a few minutes to reflect on the guiding thoughts of the day, before answering todays question. \n **Todays guiding thoughts** \n Look around the outdoor space you are in and pay attention to anything that seems neglected or in need of care. This could include physical maintenance, such as cleaning up litter, repairing equipment or trimming overgrown grass. Or, it could be about broader concerns like the state of the environment - such as the condition of plants, animals or how people interact with the space. \n Also consider who might be responsible for looking after these areas/ Is it something that the local community, city workers, or property owners should take care of? Or could it be something that others who use the space could help with as well? \n **Question for the Day** \n What do you think needs care in the space you are today? Is there something that looks neglected or in need of attention?'
    td5: '**Day 5: Long-Term vs Short-Term Care** \n Take a moment to notice you surroundings the next time you are outdoors today and take a few minutes to reflect on the guiding thoughts of the day, before answering todays question. \n **Todays guiding thoughts** \n Now that you have practised thinking about areas in need of care, think about how care might be addressed in the outdoor space you are in today. Do you see any maintenance being done, or can you imagine ways to improve the space? Is there something you could do yourself to help care for this place? \n Think about whether the care needed is a quick fix or something that requires ongoing effort. How long do you think the improvements you thought of today will last, and what could help keep the space in a better condition in the future? \n **Question for the Day** \n What care did you notice being done or that needed to be done today in the space you are in? Do you think the maintenance would last for a long time, or need to be repeated soon?'
    td6: '**Day 6 Urgency vs Deferred Tasks** \n Take a moment to notice you surroundings the next time you are outdoors today and take a few minutes to reflect on the guiding thoughts of the day, before answering todays question. \n **Todays guiding thoughts** \n As you move through the outdoor space today, think about any task or issue that feels urgent - something that seems like it needs to be fixed or taken care of straight away. Maybe it was a safety hazard, like broken glass, or a blocked drain that could cause flooding. These issues might not just make the space look untidy, but could cause harm or disruption if ignored. \n Think about how urgency shows up in this place. What makes a task feel immediate or important? And how do we decide what can wait and what cannot? \n **Question for the Day** \n Did you notice anything today that seemed like it needed urgent care or fixing? \n Think about what made it feel urgent, how it could effect the space long term if not completed. Who do you think should have stepped in to fix it and did anyone take action? If it was you feel free to say.'
    td7: '**Day 7 Community Care** \n Take a moment to notice you surroundings the next time you are outdoors today and take a few minutes to reflect on the guiding thoughts of the day, before answering todays question. \n **Todays guiding thoughts** \n As you look around the space you are in today, try thinking beyond your own experience. Who else might use this place, families, older neighbours, people dog walking, animals? Who benefits when it is clean, safe and cared for? \n Different people in the community use outdoor spaces in different ways. If the outdoor space was maintained well or adapted think about how that can include a wider range of people in using that space.\n **Question for the Day** \n Is there someone else you think would benefit from the space you are in today being well cared for? \n This might be someone on a personal level to wider members of the community. Why might it matter to them that this space is maintained?'
    td8: '**Day 8 Caring Responsibility** \n Take a moment to notice you surroundings the next time you are outdoors today and take a few minutes to reflect on the guiding thoughts of the day, before answering todays question. \n **Todays guiding thoughts** \n Think about something that you have noticed that needs care in the space today (e.g., plants, water, drainage), who should take care of it? Is it something you feel able to do, or is it someone elses responsibility? Reflect on how care can be shared fairly - and what respectful action looks like when you are asking others to take part. \n **Question for the Day** \n If you saw something that needed attention today, did it feel like your responsibility? Who do you think should take care of it and why? \n If it is someone elses role, how might you respectfully remind or ask them to take action? '
    td9: '**Day 9 Caring Together** \n Take a moment to notice you surroundings the next time you are outdoors today and take a few minutes to reflect on the guiding thoughts of the day, before answering todays question. \n **Todays guiding thoughts** \n Yesterday, you reflected on whether someone else should take responsibility for care. Today, think about how care can be shared. Some spaces thrive because people work together to look after them - whether its volunteering to litter pick, plant flowers or be part of a neighbourhood watch. These small actions, when done together, can make a big difference. \n Consider how caring for outdoor spaces is part of caring for the environment. Taking action locally can support nature, reduce pollution, and make places more enjoyable for everyone. \n **Question for the Day** \n How do you think care for outdoor spaces could be shared in your community? \n Can you think of ways people could come together to care for the place - whether informally (neighbours helping each other out) or more organised (like Wear Rivers Trust litter picking days)? What kind of support or encouragement might help others get involved?  '
    td10: '**Day 10 Caring Commitment**\n Take a moment to notice you surroundings the next time you are outdoors today and take a few minutes to reflect on the guiding thoughts of the day, before answering todays question. \n **Todays guiding thoughts** \n Caring for shared spaces can be rewarding but it also takes time. Some can find small tasks easy to fit into their day, while others may feel stretched, or uncertain about how much time and energy they can give. \n Try to reflect on your own experiences. Is this something you think about? Does it feel manageable or does it sometimes feel like too much? \n **Question for the Day** \n How do you feel about the time it takes to care for the shared outdoor space you are in today? \n Reflect on how you think the community could balance the need for care with the realities of daily life. Is it a shared responsibility that everyone should take part in, or are there ways to make this care feel more manageable for those involved?'
    td11: '**Day 11 Support or Control?** \n Take a moment to notice you surroundings the next time you are outdoors today and take a few minutes to reflect on the guiding thoughts of the day, before answering todays question. \n **Todays guiding thoughts** \n You may have noticed that the council or other organisations are not always present in maintaining local spaces. You might have even thought they should do more in these areas. Think about any communal actions, whether they are planned (e.g., community gardening events) or informal (e.g., neighbours helping each other). \n But there is often a fine line between offering support and taking control. When people in a community have cared for a place, they often know it best and may feel a strong sense of ownership and pride. \n **Question for the Day** \n If the council or other organisations step in to help care for outdoor spaces, how would that feel? Should they support the ongoing community efforts or or could that risk treating locals as volunteers working for them? \n What kind of help would feel respectful and useful, without removing the communities voice or connection to the space? What kind of support, social, evironmental or technological might help people care more or care differently for these spaces? '
    td12: '**Day 12 Technology Support for Everyday Care** \n Take a moment to notice you surroundings the next time you are outdoors today and take a few minutes to reflect on the guiding thoughts of the day, before answering todays question. \n **Todays guiding thoughts** \n Over this study, you have noticed what needs care in your local outdoor spaces sometimes as an individual, as a community and sometimes not at all. You have also reflected on who takes responsibility on time, responsibility, urgency, and who steps in when help is needed. \n Now consider in the space you are today, could technology support these acts of care? Not to replace human involvement, but to gently support it - by helping people to remember, notice patterns, share updates or connect with others interesting in the same things, such as this whatsapp group. \n You might consider, a whatsapp message or group reminder, a shared app with photos and updates, a sensor that shows flooding or plant health or a physical device in the space that gives prompts and suggestions for care. \n **Question for the Day** \nHow could technology support you, or your community, in caring for this space? Could reminders, shared check-ins, or alters be helpful? What kinds of support would make a difference in how often or easily people care for the space?'
    td13: '**Day 13 What Has Changed?** \n Take a moment to notice you surroundings the next time you are outdoors today and take a few minutes to reflect on the guiding thoughts of the day, before answering todays question. \n **Todays guiding thoughts** \n Over the past two weeks, you have been observing and reflecting on the care of outdoor spaces - what needs attention, who takes responsibility and how you feel in those environments. Today is a moment to pause and notice, has anything changed? \n You might have seen small signs of improvement - like less litter, clearer paths, or someone quietly tending to an issue you noticed earlier, maybe that someone is you. Or maybe things have stayed the same, or even worsened. Either way, you perspective may also have shifted in how you see and relate to the space. \n **Question for the Day** \n Do you think the space(s) you have been spending time in have changed over the past two weeks? \n What is different, if anything? Have issues you noticed early on been addressed, or are they still there? Are there signs of ongoing care, or signs of neglect? \n Reflect not only on the physical changes, but also on how your own relationship with the space may have shifted.'
    td14: '**Day 14 Final Reflection** \n For the final time, take a moment to notice you surroundings the next time you are outdoors today and take a few minutes to reflect on the guiding thoughts of the day, before answering todays question. \n **Todays guiding thoughts** \n Over the past two weeks, you have paid close attention to the spaces around you - what they need, how they are maintained and who takes care of them. You have explored ideas of responsibility, urgency, time, community and even how technology might support everyday environmental care. \n Today is a moment to look back and reflect on how your understanding of caring for public and share spaces has changed? \n Do you see care differently? Do you notice any patters that stood out to you, things that came up again and again, maybe as frustrations or joy? What would make it easier, more fulfilling or more sustainable for people to care for these spaces long-term? \n **Question for the Day** \n How has your understanding of caring for public spaces changed during this study? \n Think back to your experiences and observations, how do you now view the care and effort required for public and community spaces? This is a chance to reflect on any shifts in your thinking. Has your relationship with outdoor spaces evolved? DO you now see care as a shared, ongoing process and where do you see yourself within it? '
    td15: 'Gentle Reminder \n Please remember to complete your response to the questions for today, using pictures, words and/or voice notes'
    # td16: '"Put on a brave face" - make your face look brave, take a photo in the mirror and share your "brave face" (for example put on some lipstick, or use some tape to shape your face).'
    # td17: 'Make the face of your loved one in a loo role tube.'
